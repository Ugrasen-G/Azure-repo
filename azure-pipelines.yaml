trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '5.3.0'
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  azureServiceConnection: 'YOUR-AZURE-SERVICE-CONNECTION'

stages:

# ============================================================
# Stage 1: Terraform Validate & Plan
# ============================================================
- stage: TerraformPlan
  displayName: 'Terraform Plan'
  jobs:
    - job: Plan
      displayName: 'Terraform Init, Validate & Plan'

      steps:

        - checkout: self

        # Install Terraform
        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '$(terraformVersion)'

        # Azure Login
        - task: AzureCLI@2
          displayName: 'Azure Login'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              az account show

        # Terraform Init
        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(azureServiceConnection)'
            backendAzureRmResourceGroupName: 'YOUR-TFSTATE-RG'
            backendAzureRmStorageAccountName: 'YOUR-TFSTATE-STORAGE'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'terraform.tfstate'

        # Terraform Validate
        - task: TerraformTaskV4@4
          displayName: 'Terraform Validate'
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(terraformWorkingDirectory)'

        # Terraform Plan
        - task: TerraformTaskV4@4
          displayName: 'Terraform Plan'
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(terraformWorkingDirectory)'
            environmentServiceNameAzureRM: '$(azureServiceConnection)'
            commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

        # Publish Terraform Plan
        - task: PublishPipelineArtifact@1
          displayName: 'Publish Terraform Plan'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
            artifact: 'terraform-plan'


# ============================================================
# Stage 2: Terraform Apply
# ============================================================
- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:
    - deployment: Apply
      displayName: 'Terraform Apply'
      environment: 'terraform-production'

      strategy:
        runOnce:
          deploy:

            steps:

              - checkout: self

              # Install Terraform
              - task: TerraformInstaller@1
                displayName: 'Install Terraform'
                inputs:
                  terraformVersion: '$(terraformVersion)'

              # Download Plan Artifact
              - task: DownloadPipelineArtifact@2
                displayName: 'Download Terraform Plan'
                inputs:
                  artifact: 'terraform-plan'
                  path: '$(Pipeline.Workspace)/terraform-plan'

              # Terraform Init
              - task: TerraformTaskV4@4
                displayName: 'Terraform Init'
                inputs:
                  provider: 'azurerm'
                  command: 'init'
                  workingDirectory: '$(terraformWorkingDirectory)'
                  backendServiceArm: '$(azureServiceConnection)'
                  backendAzureRmResourceGroupName: 'YOUR-TFSTATE-RG'
                  backendAzureRmStorageAccountName: 'YOUR-TFSTATE-STORAGE'
                  backendAzureRmContainerName: 'tfstate'
                  backendAzureRmKey: 'terraform.tfstate'

              # Terraform Apply
              - task: TerraformTaskV4@4
                displayName: 'Terraform Apply'
                inputs:
                  provider: 'azurerm'
                  command: 'apply'
                  workingDirectory: '$(terraformWorkingDirectory)'
                  environmentServiceNameAzureRM: '$(azureServiceConnection)'
                  commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'
